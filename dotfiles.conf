# dotfiles.conf — daftar apa saja yang di-backup & di-restore.
# Dipakai bersama oleh backup.sh dan install.sh. Tambah/hapus item di sini.

# ── File & folder di $HOME (path relatif terhadap $HOME) ──
HOME_ITEMS=(
    .zshrc .bashrc .bash_profile .zprofile .profile .gitconfig
    .themes .fonts
    myskrip
    Pictures/wallpapers

    .config/hypr .config/waybar .config/rofi .config/quickshell
    .config/swaync .config/wallust .config/wlogout .config/nwg-displays
    .config/swappy .config/xdg-desktop-portal

    .config/kitty .config/ghostty .config/wezterm .config/fish
    .config/fastfetch .config/btop .config/htop .config/cava

    .config/gtk-3.0 .config/gtk-4.0 .config/Kvantum .config/qt5ct .config/qt6ct
    .config/Thunar .config/xfce4 .config/Mousepad .config/mpv .config/qalculate
    .config/easyeffects .config/wireplumber .config/autostart

    .config/mimeapps.list .config/user-dirs.dirs .config/user-dirs.locale
    .config/brave-flags.conf .config/dolphinrc .config/kdenliverc
)

# ── File & folder sistem (path absolut). Di-restore dengan sudo. ──
SYSTEM_ITEMS=(
    /etc/pacman.conf
    /etc/default/grub
    /etc/mkinitcpio.conf
    /etc/sddm.conf
    /etc/nbfc/nbfc.json
    /etc/X11/xorg.conf.d/00-keyboard.conf
    /etc/modprobe.d
    /boot/grub/themes/bsol
    /usr/share/sddm/themes/simple_sddm_2
)

# File yang hanya disimpan sebagai REFERENSI (tidak otomatis di-restore,
# karena UUID disk di laptop baru pasti berbeda).
REFERENCE_ITEMS=(
    /etc/fstab
)

# Pola yang tidak ikut di-backup (file cadangan, cache, dll).
EXCLUDES=(
    '*.bak' '*.bak-*' '*.bak.*' '*-backup-*' '*.save' '*.save.*'
    '.cleanup-backup-*' '__pycache__' '*.pyc' '*.log' 'node_modules'
    '.git'
)

# Paket AUR yang tidak perlu dicatat (debug / sudah di-bootstrap otomatis).
AUR_IGNORE_REGEX='(-debug$|^yay(-bin)?$)'

# Paket tambahan yang selalu dipasang walau tidak ter-install "explicit"
# (mis. tema ikon Flat-Remix di ~/.icons sengaja tidak di-backup karena 600MB+).
EXTRA_AUR=(flat-remix flat-remix-gtk)
