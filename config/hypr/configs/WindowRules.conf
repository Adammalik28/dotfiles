# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */ #
# WindowRules.conf - Fixed & Optimized for Adam
# Hyprland >= 0.53 — May 2026
# Catatan: Rule dievaluasi dari atas ke bawah. Rule paling bawah memiliki prioritas tertinggi.

# =============================================
# 1. TAGGING RULES
# =============================================

# Browser
windowrule = match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$, tag +browser
windowrule = match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?|chrome-.+-Default|[Cc]hromium|[Mm]icrosoft-edge(-stable|-beta|-dev|-unstable)?|Brave-browser(-beta|-dev|-unstable)?|zen-alpha|zen|[Tt]horium-browser|[Cc]achy-browser)$, tag +browser

# Instant Messaging (IM)
windowrule = match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop|[Ww]asitlos|org.telegram.desktop|io.github.tdesktop_x64.TDesktop|[Ff]erdium|[Ww]hatsapp-for-linux|teams-for-linux|im.riot.Riot|Element)$, tag +im

# Development / Projects
windowrule = match:class ^(codium|codium-url-handler|VSCodium|VSCode|code|code-url-handler|jetbrains-.+|dev.zed.Zed|antigravity)$, tag +projects

# Games & Store
windowrule = match:class ^(gamescope|steam_app_\d+)$, tag +games
windowrule = match:class ^([Ss]team)$, tag +gamestore
windowrule = match:title ^([Ll]utris)$, tag +gamestore
windowrule = match:class ^(com.heroicgameslauncher.hgl)$, tag +gamestore

# Utility
windowrule = match:class ^(Alacritty|kitty|kitty-dropterm)$, tag +terminal
windowrule = match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt|app.drey.Warp)$, tag +file-manager
windowrule = match:class ^([Mm]pv|vlc)$, tag +multimedia_video
windowrule = match:class ^([Aa]udacious)$, tag +multimedia
windowrule = match:class ^(com.obsproject.Studio)$, tag +screenshare
windowrule = match:class ^([Ww]aytrogen)$, tag +wallpaper

# Settings & Viewer
windowrule = match:class ^(nwg-displays|nwg-look|qt[56]ct|pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|wihotspot|btrfs-assistant|timeshift-gtk|gnome-disks|file-roller|org.gnome.FileRoller|nm-applet|nm-connection-editor|blueman-manager|org.kde.polkit-kde-authentication-agent-1|[Rr]ofi|seahorse)$, tag +settings
windowrule = match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|evince|eog|org.gnome.Loupe)$, tag +viewer

# KooL & Notif
windowrule = match:title ^(KooL Quick Cheat Sheet)$, tag +KooL_Cheat
windowrule = match:title ^(KooL Hyprland Settings)$, tag +KooL_Settings
windowrule = match:class ^(swaync-.*)$, tag +notif

# Custom Scripts (atur.sh / ceklog.sh)
windowrule = match:title ^(atur\.sh)$, tag +custom_script
windowrule = match:title ^(ceklog\.sh)$, tag +custom_script

# scrcpy
windowrule = match:class ^(scrcpy)$, tag +scrcpy

# =============================================
# 2. WORKSPACE ASSIGNMENT
# =============================================

windowrule = match:tag im, workspace 2
windowrule = match:tag projects, workspace 3
windowrule = match:tag gamestore, workspace 5
windowrule = match:tag multimedia, workspace 9 silent
windowrule = match:tag browser, workspace 2

# FIX: Override browser workspace — hanya ditulis SEKALI di sini (hapus duplikasi)
windowrule = match:class ^(Brave-browser)$, workspace 1
windowrule = match:class ^([Ff]irefox)$, workspace 1
windowrule = match:class ^([Ww]asitlos)$, workspace 1

# =============================================
# 3. BEHAVIOR & PERFORMANCE
# =============================================

# Opacity
windowrule = match:tag browser, opacity 0.99 0.8
windowrule = match:tag projects, opacity 0.9 0.8
windowrule = match:tag im, opacity 0.94 0.86
windowrule = match:tag multimedia, opacity 0.94 0.86
windowrule = match:tag file-manager, opacity 0.9 0.8
windowrule = match:tag terminal, opacity 0.9 0.7
windowrule = match:tag settings, opacity 0.8 0.7
windowrule = match:tag viewer, opacity 0.82 0.75
windowrule = match:tag wallpaper, opacity 0.9 0.7

# No blur & special behavior
windowrule = match:tag multimedia_video, no_blur on, opacity 1.0
windowrule = match:tag games, no_blur on, immediate on
windowrule = match:fullscreen true, idle_inhibit fullscreen

# =============================================
# 4. FLOAT, SIZE & POSITION
# =============================================

# FIX: tag KooL_Settings pakai underscore (konsisten dengan section 1)
windowrule = match:tag KooL_Cheat, float on, center on, size (monitor_w*0.65) (monitor_h*0.9)
windowrule = match:tag KooL_Settings, float on, center on
windowrule = match:tag settings, float on, center on, size (monitor_w*0.7) (monitor_h*0.7)
windowrule = match:tag viewer, float on, center on
windowrule = match:tag wallpaper, float on, center on, size (monitor_w*0.7) (monitor_h*0.7)
windowrule = match:class ^([Ff]erdium)$, float on, center on, size (monitor_w*0.6) (monitor_h*0.7)

# Dialog & special windows
windowrule = match:title ^(Authentication Required|Save As|Add Folder to Workspace)$, float on, center on, size (monitor_w*0.7) (monitor_h*0.6)
windowrule = match:class ^(yad)$, float on, center on, size (monitor_w*0.2) (monitor_h*0.2)
windowrule = match:class ^(mpv|com.github.rafostar.Clapper)$, float on

# scrcpy — FIX: syntax baru (matcher dulu, baru rule)
windowrule = match:tag scrcpy, float on
windowrule = match:tag scrcpy, move 78% 5%

# Custom Scripts — float, ukuran, posisi, opacity
windowrule = match:tag custom_script, float on
windowrule = match:tag custom_script, size 767 675
windowrule = match:tag custom_script, center on
windowrule = match:tag custom_script, opacity 0.9 0.8

# =============================================
# 5. NAMED WINDOW RULES
# =============================================

windowrule {
    name = Picture-in-Picture
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    move = 72% 7%
    opacity = 0.95 0.75
    keep_aspect_ratio = on
    size = (monitor_w*0.3) (monitor_h*0.3)
}

windowrule {
    name = Thunar-Progress-bar
    match:class = ^(thunar)$
    match:title = ^(File Operation Progress)$
    float = on
    center = on
    size = (monitor_w*0.26) (monitor_h*0.18)
}

# =============================================
# 6. LAYER RULES
# =============================================

layerrule = match:namespace rofi, blur on
layerrule = match:namespace notifications, blur on
layerrule = match:namespace quickshell:overview, blur on, ignore_alpha 0.5
