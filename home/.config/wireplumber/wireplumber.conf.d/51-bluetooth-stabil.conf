# Dibuat oleh Digidaw (Claude) 8 Nov 2026: headset Bluetooth sering "kresek".
# Penyebab: codec LHDC v5 (bitrate sangat tinggi) di Intel AX201, yang berbagi antena dengan Wi-Fi;
# log: "Missing completion reports for packet ... firmware bug?" dan transport terputus.
# Hanya codec yang ringan yang dipakai; penyangga lebih besar untuk audio Bluetooth.
# Hapus berkas ini untuk kembali seperti semula.
monitor.bluez.properties = {
  bluez5.codecs = [ aac sbc_xq sbc ]
}
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { node.latency = "1024/48000" } }
  }
]
