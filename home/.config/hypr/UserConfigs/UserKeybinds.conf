# --- 🛠️ CARA MEMBUAT BIND DI HYPRLAND ---
# Format: bind = MODIFIER, KEY, DESCRIPTION, DISPATCHER, PARAMS
# 1. MODIFIER: Tombol utama (contoh: $mainMod, SHIFT, ALT).
# 2. KEY: Tombol yang ditekan (contoh: Return, T, Z).
# 3. DESCRIPTION: Penjelasan fungsi (penting untuk menu pencarian/rofi).
# 4. DISPATCHER: Perintah Hyprland (contoh: exec, killactive, movefocus).
# 5. PARAMS: Aplikasi atau argumen yang dijalankan.

# --- ⚙️ VARIABEL ---
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# --- ⌨️ KEYBINDS ---

# Contoh cara unbind dan remap (Hapus tanda # jika ingin digunakan):
# unbind = $mainMod, Return
# bindd = $mainMod, Return, Terminal, exec, ghostty

# --- 🖥️ VM PASSTHROUGH ---
bind = $mainMod ALT, P, submap, passthru
submap = passthru
bind = $mainMod ALT, P, submap, reset
submap = reset


# NB: bind $mainMod,S dan $mainMod,equal untuk myskrip sudah ada (versi lebih baru,
# dengan float/size/center) di configs/Keybinds.conf:237-238 — sengaja tidak diduplikasi di sini.
# NB: $mainMod ALT,Return (terminal floating) juga sudah ada di configs/Keybinds.conf:236
# ([float;size 1000 600;center] $term) — sengaja tidak diduplikasi di sini (dulu sempat
# menyebabkan 2 terminal terbuka sekaligus saat direstore dari backup).

bind = $mainMod, l, exec, zsh -ic "hp"
bind = $mainMod, c, exec, zsh -ic "catat"
bind = $mainMod, f, exec, zsh -ic "film"
bind = $mainMod, o, exec, zsh -ic "wasistlos"
bind = $mainMod, j, exec, zsh -ic "wa"


bind = $mainMod, slash, exec, zsh -ic "emulator"
bind = $mainMod, y, exec, zsh -ic "code"
