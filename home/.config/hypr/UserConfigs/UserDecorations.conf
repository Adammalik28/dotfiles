# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

# macOS look: hairline neutral border instead of neon wallust colours,
# soft deep drop shadow, squircle corners, roomier gaps that line up with the
# floating waybar (10px sides). Previous version: UserDecorations.conf.bak-20261011
general {
  border_size = 1
  gaps_in = 0
  gaps_out = 8, 10, 0, 10    # top, right, bottom, left (flush bottom, no gap between windows)

  col.active_border = rgba(ffffff33)
  col.inactive_border = rgba(ffffff14)
}

decoration {
  rounding = 12
  rounding_power = 3.0   # squircle corners like macOS (2.0 = plain circle)

  # macOS keeps background windows opaque and undimmed; focus is shown by the shadow
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.1
  dim_special = 0.5

  shadow {
    enabled = true
    range = 28
    render_power = 3
    offset = 0 8
    color = rgba(00000073)
    color_inactive = rgba(00000038)
  }

  blur {
    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}

# Blur mode toggle (SUPER+ALT+O): normal = opaque windows, less blur = transparent windows
source = $HOME/.config/hypr/UserConfigs/BlurMode.conf
