# Waybar: blur behind the translucent bar (macOS-style)
layerrule = match:namespace waybar, blur on, ignore_alpha 0.2

# SwayNC (Control Center & Notifications): blur & slide down from top (macOS-style)
layerrule = match:namespace swaync-control-center, blur on, ignore_alpha 0.2, xray off
layerrule = match:namespace swaync-control-center, animation slide top
layerrule = match:namespace swaync-notification-window, blur on, ignore_alpha 0.2, xray off
layerrule = match:namespace swaync-notification-window, animation slide top
