# macOS-style motion: quick ease-out curves, no bounce/overshoot.
# Windows zoom+fade in, close fast; workspaces slide sideways like Spaces.
# Previous version: UserAnimations.conf.bak-20261011
# (Hyprland speed unit = 100ms, so 3.5 = 350ms)
animations {
  enabled = yes

  bezier = easeOutQuint, 0.22, 1, 0.36, 1      # Apple-like decelerate
  bezier = easeInOutCubic, 0.65, 0, 0.35, 1    # smooth both ends (Spaces)
  bezier = easeInQuad, 0.55, 0, 1, 0.45        # quick exit
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 4, easeOutQuint
  animation = windowsIn, 1, 3.5, easeOutQuint, popin 88%
  animation = windowsOut, 1, 2, easeInQuad, popin 92%
  animation = windowsMove, 1, 4, easeOutQuint, slide

  animation = fade, 1, 3, easeOutQuint
  animation = fadeOut, 1, 2, easeInQuad

  animation = layers, 1, 3.2, easeOutQuint, slide top
  animation = layersIn, 1, 3.2, easeOutQuint, slide top
  animation = layersOut, 1, 2.2, easeInQuad, slide top

  animation = border, 1, 3, easeOutQuint
  animation = borderangle, 1, 180, liner, loop   # only used if Rainbow Borders is re-enabled

  animation = workspaces, 1, 4.5, easeInOutCubic, slide
  animation = specialWorkspace, 1, 4, easeOutQuint, slidevert
}
