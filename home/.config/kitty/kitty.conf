# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/macOS-Dark.conf

font_family JetBrainsMono Nerd Font
font_size 10.5
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.88
dynamic_background_opacity 1
confirm_os_window_close 0
remember_window_size no

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 10 14
# selection_foreground none
# selection_background none
# foreground #dddddd
# background #000000
# cursor #dddddd

# BEGIN_KITTY_THEME
# Brogrammer
# disabled: it overrode the kitty-themes include above (and the theme switcher)
# include current-theme.conf
# END_KITTY_THEME

# macOS Terminal feel
modify_font cell_height 104%
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_title_template " {index}: {title} "

# managed by ChangeBlur.sh (SUPER+ALT+O): 1.0 in normal-blur mode, translucent in less-blur mode
include blur-mode.conf
